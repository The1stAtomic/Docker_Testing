<!DOCTYPE html>

<html lang="en" class="max-w-[100vw] overflow-x-hidden">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tomato Timer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb3b3">
    <link rel="apple-touch-icon" href="icon-512.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-dim": "#770326",
                        "surface-variant": "#ffd9e2",
                        "primary-fixed": "#ffb3b3",
                        "secondary-dim": "#285e30",
                        "outline-variant": "#e39fb2",
                        "on-error": "#fff7f7",
                        "on-secondary-container": "#2e6335",
                        "background": "#fff8f8",
                        "on-secondary": "#e9ffe5",
                        "primary": "#894e4f",
                        "inverse-primary": "#ffb3b3",
                        "surface-container": "#ffe8ed",
                        "secondary-fixed-dim": "#b3eeb3",
                        "primary-dim": "#7b4344",
                        "secondary-container": "#c0fdc0",
                        "tertiary-fixed": "#ecc3b7",
                        "on-tertiary-fixed-variant": "#63463d",
                        "tertiary-dim": "#6a4c43",
                        "outline": "#a5697b",
                        "secondary": "#346a3b",
                        "on-error-container": "#68001f",
                        "on-tertiary-fixed": "#432a22",
                        "tertiary-container": "#ecc3b7",
                        "on-secondary-fixed-variant": "#386e3e",
                        "error-container": "#f76a80",
                        "on-primary-fixed-variant": "#70393a",
                        "on-surface-variant": "#864f5f",
                        "primary-container": "#ffb3b3",
                        "surface-tint": "#894e4f",
                        "on-primary-container": "#653032",
                        "surface-container-low": "#fff0f2",
                        "on-primary": "#fff7f6",
                        "tertiary": "#77584f",
                        "surface-container-high": "#ffe1e7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#fff7f5",
                        "surface-bright": "#fff8f8",
                        "on-background": "#522333",
                        "secondary-fixed": "#c0fdc0",
                        "inverse-surface": "#1d070e",
                        "surface-container-highest": "#ffd9e2",
                        "tertiary-fixed-dim": "#ddb6aa",
                        "surface": "#fff8f8",
                        "on-primary-fixed": "#4c1d1f",
                        "error": "#ac3149",
                        "primary-fixed-dim": "#f0a6a6",
                        "inverse-on-surface": "#bb929c",
                        "surface-dim": "#ffcdd9",
                        "on-secondary-fixed": "#1a5024",
                        "on-tertiary-container": "#593d35",
                        "on-surface": "#522333"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .sticker {
            filter: drop-shadow(4px 4px 0px rgba(82, 35, 51, 0.2));
            z-index: 0;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 20px;
            border-width: 12px 12px 0 0;
            border-style: solid;
            border-color: #522333 transparent transparent transparent;
        }

        .speech-bubble-inner::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 21px;
            border-width: 10px 10px 0 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        @keyframes float-up {
            0% {
                transform: translateY(110vh) rotate(0deg);
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
            }
        }

        .bg-tomato {
            position: absolute;
            will-change: transform; /* Tells the browser to optimize this element */
            opacity: 0.15; /* Keep it subtle so it doesn't distract from the timer */
        }

        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }

        /* Easter Egg Text Animation and Styling */
        @keyframes float-up-text {
            0% { transform: translateY(110vh) translateX(0px) rotate(-3deg); }
            50% { transform: translateY(45vh) translateX(20px) rotate(3deg); }
            100% { transform: translateY(-20vh) translateX(-10px) rotate(-3deg); }
        }

        .bg-text-bubble {
            position: absolute;
            will-change: transform;
            opacity: 0.20; 
            background-color: white;
            border: 2px solid #522333;
            border-radius: 1rem;
            padding: 6px 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            color: #522333;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
        }

        /* The dark brown outer tail */
        .bg-text-bubble::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 15px;
            border-width: 6px 6px 0 0;
            border-style: solid;
            border-color: #522333 transparent transparent transparent;
        }

        /* The white inner tail */
        .bg-text-bubble::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 16px;
            border-width: 4px 4px 0 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
            </style>
</head>

<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center max-w-[100vw] overflow-x-hidden relative">
    <div id="pomo-field" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>
    <!-- Main Content Canvas -->
    <main class="flex-1 w-full max-w-sm px-4 flex flex-col items-center justify-center min-h-screen relative z-10">
        <!-- Background Decorative Stickers -->
        <!-- Sprout -->
        <div
            class="sticker absolute -top-4 -left-2 rotate-[-15deg] w-16 h-16 flex items-center justify-center bg-[#c0fdc0] border-[3px] border-[#522333] rounded-full">
            <span class="material-symbols-outlined text-3xl text-[#1a5024]"
                style="font-variation-settings: 'FILL' 1;">potted_plant</span>
        </div>
        <!-- Star Top Right -->
        <div
            class="sticker absolute top-10 -right-4 rotate-[10deg] w-12 h-12 flex items-center justify-center bg-yellow-200 border-[3px] border-[#522333] rounded-xl">
            <span class="material-symbols-outlined text-2xl text-[#522333]"
                style="font-variation-settings: 'FILL' 1;">star</span>
        </div>
        <!-- Heart Bottom Left -->
        <div
            class="sticker absolute bottom-12 -left-6 rotate-[20deg] w-14 h-14 flex items-center justify-center bg-[#ffb3b3] border-[3px] border-[#522333] rounded-2xl">
            <span class="material-symbols-outlined text-2xl text-[#68001f]"
                style="font-variation-settings: 'FILL' 1;">favorite</span>
        </div>
        <!-- Star Bottom Right -->
        <div
            class="sticker absolute bottom-20 -right-2 rotate-[-5deg] w-10 h-10 flex items-center justify-center bg-[#ecc3b7] border-[3px] border-[#522333] rounded-full">
            <span class="material-symbols-outlined text-xl text-[#522333]"
                style="font-variation-settings: 'FILL' 1;">celebration</span>
        </div>
        <!-- Retro Computer Popup Window -->
        <div
            class="w-full bg-surface-container-lowest border-[4px] border-[#522333] rounded-lg shadow-none relative z-10">
            <!-- Retro Window Header -->
            <div
                class="bg-primary-container border-b-[4px] border-[#522333] px-4 py-2 flex justify-between items-center rounded-t-[1.7rem]">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full border-[2px] border-[#522333] bg-[#522333]"></div>
                    <div class="w-3 h-3 rounded-full border-[2px] border-[#522333]"></div>
                </div>
                <span class="font-headline font-extrabold text-sm tracking-widest text-[#522333]">TIMER_V.01</span>
                <span class="material-symbols-outlined text-lg font-bold">close</span>
            </div>
            <div class="p-5 md:p-6 flex flex-col items-center">
                <div class="relative inline-flex items-center justify-center">
                    <div class="speech-bubble absolute -top-4 -right-10 md:-right-14 bg-[#522333] rounded-2xl p-[3px] z-20">
                        <div class="speech-bubble-inner bg-white rounded-xl px-3 py-1.5 whitespace-nowrap">
                            <span id="speech-text" class="font-headline font-extrabold text-[10px] text-[#522333] uppercase tracking-wider">Ready to work? 🍅</span>
                        </div>
                    </div>
                    
                    <img id="mascot-img" alt="2D Mascot" class="w-52 h-auto md:w-64 md:h-auto object-contain relative z-10" src="static/svgs/tomato-idle.svg" />
                </div>

                <div class="text-center mb-6 relative group" id="timer-container">
                    <span id="timer-display" class="font-headline font-extrabold text-6xl md:text-7xl tracking-tighter text-[#522333] cursor-pointer hover:opacity-80 transition-opacity">
                        25:00
                    </span>
                    
                    <input id="timer-input" type="number" min="1" max="99" 
                        class="hidden w-full bg-transparent text-center font-headline font-extrabold text-6xl md:text-7xl tracking-tighter text-[#522333] outline-none border-none focus:ring-0 p-0 m-0" 
                        value="25">
                        
                    <p class="font-headline font-extrabold text-[#894e4f] mt-1 uppercase tracking-widest text-[10px] md:text-xs">
                        Stay Focused!
                    </p>
                </div>

                <div class="flex gap-3 w-full">
                    <button id="start-btn" class="flex-1 bg-secondary-container text-[#1a5024] font-headline font-extrabold py-3 px-4 rounded-full border-[3px] border-[#522333] active:translate-y-1 transition-all uppercase tracking-wider text-xs md:text-sm flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                        Start
                    </button>
                    <button id="pause-btn" class="flex-1 bg-error-container text-[#68001f] font-headline font-extrabold py-3 px-4 rounded-full border-[3px] border-[#522333] active:translate-y-1 transition-all uppercase tracking-wider text-xs md:text-sm flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">pause</span>
                        Pause
                    </button>
                </div>
            </div>
    </main>

    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.error('Service Worker failed!', err));
            });
        }
        // 1. DOM Elements
        const timerDisplay = document.getElementById('timer-display');
        const mascotImg = document.getElementById('mascot-img');
        const speechText = document.getElementById('speech-text');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const timerInput = document.getElementById('timer-input');

        // 2. State Configuration (WORK_MINUTES is now mutable)
        let WORK_MINUTES = 25; 
        let timeLeft = WORK_MINUTES * 60;
        let timerInterval = null;
        let isRunning = false;
        let expectedEndTime = 0;

        const STATE = {
            IDLE: { img: 'static/svgs/tomato-idle.svg', text: 'Ready to work? 🍅' },
            RUNNING: { img: 'static/svgs/tomato-focus.svg', text: 'Focus time! 🌸' },
            PAUSED: { img: 'static/svgs/tomato-pause.svg', text: 'Hey, keep going! 😠' },
            DONE: { img: 'static/svgs/tomato-done.svg', text: 'You did it! 🎉' }
        };

        // 3. Helper Functions
        function updateUI(state) {
            mascotImg.src = state.img;
            speechText.innerText = state.text;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // --- BACKGROUND TOMATO GENERATOR ---
        function spawnPomoField(tomatoCount) {
            const field = document.getElementById('pomo-field');
            
            // 1. Create an array of all four asset paths
            const tomatoAssets = [
                'static/svgs/tomato-idle.svg',
                'static/svgs/tomato-focus.svg',
                'static/svgs/tomato-pause.svg',
                'static/svgs/tomato-done.svg'
            ]; 

            for (let i = 0; i < tomatoCount; i++) {
                const img = document.createElement('img');
                
                // 2. Pick a random asset from the array for this specific image
                const randomAsset = tomatoAssets[Math.floor(Math.random() * tomatoAssets.length)];
                img.src = randomAsset;
                
                img.classList.add('bg-tomato');

                // Randomize Size (between 40px and 120px)
                const size = Math.random() * 80 + 40;
                img.style.width = `${size}px`;
                img.style.height = `${size}px`;

                // Randomize Horizontal Position (0% to 100% of screen width)
                img.style.left = `${Math.random() * 100}vw`;

                // Randomize Animation Duration & Delay (Speed)
                const duration = Math.random() * 15 + 10; 
                const delay = Math.random() * -20; 
                img.style.animation = `float-up ${duration}s linear ${delay}s infinite`;

                // Randomize the Blur (Depth of Field effect)
                const blurAmount = (120 - size) / 15; 
                img.style.filter = `blur(${blurAmount}px)`;

                field.appendChild(img);
            }
        }
        spawnPomoField(15);

        // --- EASTER EGG GENERATOR ---
        function spawnEasterEggs() {
            const field = document.getElementById('pomo-field');
            const eggs = [
                "Cat is better tbh",
                "I'm still waiting for my noodles",
                "You're the goat",
                "You can do it, twin",
                "Do you actually read this?",
                "I'm more goated ngl"
            ];

            eggs.forEach((text) => {
                const bubble = document.createElement('div');
                bubble.innerText = text;
                bubble.classList.add('bg-text-bubble');

                // Randomize Horizontal Position (Keep it away from the extreme edges)
                bubble.style.left = `${Math.random() * 70 + 10}vw`;

                // Randomize Animation Duration & Delay
                // We make these float slightly slower than the tomatoes
                const duration = Math.random() * 20 + 15; 
                const delay = Math.random() * -30; 
                
                bubble.style.animation = `float-up-text ${duration}s ease-in-out ${delay}s infinite`;
                
                // Randomize scale slightly for depth
                const scale = Math.random() * 0.4 + 0.8;
                bubble.style.filter = `blur(1px) scale(${scale})`;

                field.appendChild(bubble);
            });
        }

        // Fire the easter eggs
        spawnEasterEggs();

        // 4. The Core Timer Logic
        function tick() {
            const now = Date.now();
            timeLeft = Math.max(0, Math.ceil((expectedEndTime - now) / 1000));
            timerDisplay.innerText = formatTime(timeLeft);

            if (timeLeft === 0) {
                clearInterval(timerInterval);
                isRunning = false;
                updateUI(STATE.DONE);
                startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">restart_alt</span> Reset';
                pauseBtn.style.opacity = '0.5';
                pauseBtn.disabled = true;
            }
        }

        // 5. NEW: Seamless Inline Editing
        timerDisplay.addEventListener('click', () => {
            if (isRunning) return; // No editing while ticking
            
            // Hide text, show input
            timerDisplay.classList.add('hidden');
            timerInput.classList.remove('hidden');
            
            // Set value to current minutes and auto-highlight it so she can just type
            timerInput.value = WORK_MINUTES;
            timerInput.focus();
            timerInput.select(); 
        });

        // Function to save and format the new time
        function saveTimerEdit() {
            // Hide input, show text
            timerInput.classList.add('hidden');
            timerDisplay.classList.remove('hidden');

            let newMinutes = parseInt(timerInput.value);
            
            // Validate: Must be a number between 1 and 99
            if (!isNaN(newMinutes) && newMinutes > 0 && newMinutes <= 99) {
                WORK_MINUTES = newMinutes;
            } else {
                timerInput.value = WORK_MINUTES; // Revert to old value if she typed garbage
            }

            timeLeft = WORK_MINUTES * 60;
            timerDisplay.innerText = formatTime(timeLeft);
        }

        // Save when she taps anywhere else on the screen
        timerInput.addEventListener('blur', saveTimerEdit);

        // Save when she hits the "Enter" key on her keyboard/phone
        timerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                timerInput.blur();
            }
        });

        // 6. Button Listeners
        startBtn.addEventListener('click', () => {
            if (timeLeft === 0) { // Handle completion reset
                timeLeft = WORK_MINUTES * 60;
                timerDisplay.innerText = formatTime(timeLeft);
                updateUI(STATE.IDLE);
                startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span> Start';
                pauseBtn.style.opacity = '1';
                pauseBtn.disabled = false;
                return;
            }

            if (!isRunning) {
                isRunning = true;
                expectedEndTime = Date.now() + (timeLeft * 1000);
                timerInterval = setInterval(tick, 200);
                updateUI(STATE.RUNNING);
                
                // Ensure UI matches running state
                startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span> Running';
                pauseBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">pause</span> Pause';
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (isRunning) {
                // ACTION 1: Pause the timer
                clearInterval(timerInterval);
                isRunning = false;
                updateUI(STATE.PAUSED);
                
                // Transform the Pause button into a Reset button
                pauseBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">restart_alt</span> Reset';
                startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span> Resume';
            } else if (timeLeft < WORK_MINUTES * 60 && timeLeft > 0) {
                // ACTION 2: If it's already paused, clicking it again Resets everything
                timeLeft = WORK_MINUTES * 60;
                timerDisplay.innerText = formatTime(timeLeft);
                updateUI(STATE.IDLE);
                
                // Revert buttons to default
                pauseBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">pause</span> Pause';
                startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span> Start';
            }
        });

        // Initialize UI on load
        updateUI(STATE.IDLE);
        // Add visual cue that timer text is clickable
        timerDisplay.style.cursor = "pointer";
    </script>
</body>

</html>
